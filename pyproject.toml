[project]
name = "engram"
version = "0.1.0"
description = "Multimodal lecture-to-course generator: a lecture video in, notes, diagrams, flashcards, a quiz and a narrated summary out."
authors = [{ name = "Devanshi", email = "198542797+Devanshi-cmd@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
engram = "engram.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient still runs on httpx and warns about it; nothing to act on here.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompts read better as one line per rule than wrapped mid-sentence.
"engram/llm/frames.py" = ["E501"]
"engram/course/prompts.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
