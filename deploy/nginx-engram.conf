# Live copy of /etc/nginx/sites-available/engram (certbot added the TLS lines and the redirect).
# engram.devanshitiwari.com: certbot adds the TLS lines and the HTTP→HTTPS redirect.
server {
    server_name engram.devanshitiwari.com;

    # Lecture videos: up to 2 GB, streamed straight to the app instead of buffered on disk.
    client_max_body_size 2g;
    proxy_request_buffering off;

    # Browsers remember to use HTTPS for a year. This host only: other subdomains are separate sites.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4810;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/engram.devanshitiwari.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/engram.devanshitiwari.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = engram.devanshitiwari.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name engram.devanshitiwari.com;
    return 404; # managed by Certbot


}